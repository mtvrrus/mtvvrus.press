<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MTV Россия — Admin</title><link rel="stylesheet" href="../styles.css"><style>body{background:#111;color:#fff}.panel{max-width:720px;margin:8vh auto;padding:28px}.box{background:#222;padding:24px;margin:20px 0}.warn{color:#f5f500;line-height:1.6;font-size:13px}label{display:block;margin:14px 0 6px;font-size:12px;font-weight:800}input,textarea{width:100%;padding:12px;background:#111;color:#fff;border:1px solid #555;font:inherit}button{background:#f5f500;color:#111;border:0;padding:13px;font-weight:900;cursor:pointer}a{color:#f5f500}</style></head><body><main class="panel"><img src="../assets/mtv-logo.svg" width="100" alt="MTV"><p>MTV РОССИЯ / ADMIN</p><h1>Панель управления</h1><div class="box"><p class="warn">Демо: статический сайт не обеспечивает серверную авторизацию. Изменения сохраняются только в этом браузере. Для общей публикации нужен backend.</p><label>Главный заголовок</label><input id="title" placeholder="MTV NEWS"><label>Объявление</label><textarea id="text" rows="4"></textarea><br><br><button id="save">Сохранить локально</button> <button id="clear">Сбросить</button><p id="status"></p></div><a href="../">← На сайт</a></main><script>let t=document.querySelector('#title'),x=document.querySelector('#text'),s=document.querySelector('#status');t.value=localStorage.mtv_title||'';x.value=localStorage.mtv_text||'';document.querySelector('#save').onclick=()=>{localStorage.mtv_title=t.value;localStorage.mtv_text=x.value;s.textContent='Сохранено в этом браузере.'};document.querySelector('#clear').onclick=()=>{localStorage.removeItem('mtv_title');localStorage.removeItem('mtv_text');t.value=x.value='';s.textContent='Сброшено.'}</script></body></html>
